name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Revisar sintaxis
        run: python -m compileall -q datosdemocl tests

  build-windows-executable:
    name: Build · Windows executable
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar herramienta de empaquetado
        run: python -m pip install -r requirements-build.txt
      - name: Construir ejecutable
        shell: pwsh
        run: ./construir_ejecutable.ps1
      - name: Comprobar artefacto
        shell: pwsh
        run: if (-not (Test-Path -LiteralPath "DatosDemoCL.exe")) { throw "No se generó DatosDemoCL.exe" }
